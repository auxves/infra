name: Staging
run-name: "Staging PR #${{ github.event.pull_request.number }}"

# Deploys a PR to `staging` for testing on the real host, then waits for the
# agent's `Staging / Tests` check run to resolve.
# SECURITY: `pull_request_target` runs this workflow from `main`, never from
# the PR. Do not change it to `pull_request` — a PR editing this file could
# then push arbitrary code to `staging`.

on:
  pull_request_target:
    types: [labeled]
    branches: [main]

# Pushes to `staging` go through the deploy key, not this token.
permissions:
  contents: read
  pull-requests: read
  checks: read # poll the agent's `Staging / Tests` check run

jobs:
  deploy:
    name: Deploy
    if: >
      github.event.label.name == 'testing requested' &&
      github.event.pull_request.state == 'open' &&
      github.event.sender.login == 'auxves'
    runs-on: ubuntu-latest
    environment: Staging
    concurrency:
      group: staging
      cancel-in-progress: false
      queue: max
    timeout-minutes: 180
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.STAGING_DEPLOY_KEY }}

      - name: Squash the PR onto main and push to staging
        id: push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B staging-test origin/main
          git merge --squash "$PR_HEAD"
          git commit -m "Staging test: ${PR_TITLE} (#${PR_NUMBER})" \
                     -m "Squashed from ${PR_HEAD}. Deployed to staging for testing; do not merge this branch."
          git push --force-with-lease origin staging-test:staging
          echo "tip_sha=$(git rev-parse staging-test)" >> "$GITHUB_OUTPUT"

      # The agent's detector removes the `testing requested` trigger label
      # when it claims the tip; the workflow token cannot (403).

      - name: Wait for the staging test check
        # Only the terminal state matters, so a fast agent verdict between
        # polls is harmless (the old label-polling claim race can't recur).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          TIP_SHA: ${{ steps.push.outputs.tip_sha }}
        run: |
          deadline=$(( $(date +%s) + 7200 ))  # ~120 min
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # check_name must be pre-encoded: gh's -f leaves the literal `/`
            # unencoded, which 404s the endpoint.
            # Filter by external_id (the tip SHA): a re-test leaves the previous
            # run's completed check on this commit, which max_by(.id) alone would pick up.
            check=$(gh api "repos/${{ github.repository }}/commits/${PR_HEAD}/check-runs?check_name=Staging%20%2F%20Tests" \
              --jq --arg tip "$TIP_SHA" '[.check_runs[] | select(.external_id == $tip)] | max_by(.id) // empty')
            status=$(echo "$check" | jq -r '.status // empty')
            if [ -z "$status" ]; then
              echo "Check run not created yet; waiting for the agent to claim."
            elif [ "$status" != "completed" ]; then
              echo "Check run in progress; waiting."
            else
              conclusion=$(echo "$check" | jq -r '.conclusion')
              echo "Check run completed: $conclusion"
              case "$conclusion" in
                success) exit 0 ;;
                cancelled)
                  echo "Superseded by a newer test run; the newer run owns staging."
                  exit 0
                  ;;
                *)
                  echo "::error::Staging test reported $conclusion."
                  exit 1
                  ;;
              esac
            fi
            sleep 60
          done
          echo "::error::Timed out waiting for the staging test check."
          exit 1

      - name: Roll staging back to main (on test failure)
        # Gated on the push having succeeded, so a squash failure doesn't clobber staging.
        # The tip guard keeps a superseding run's newer staging push safe.
        if: (failure() || cancelled()) && steps.push.outcome == 'success'
        run: |
          git fetch origin main
          tip=$(git ls-remote origin staging | cut -f1)
          if [ "$tip" = "${{ steps.push.outputs.tip_sha }}" ]; then
            # Delete the branch first: comin only redeploys staging on delete+recreate, not a force-push.
            git push origin --delete staging
            git push origin refs/remotes/origin/main:refs/heads/staging
          else
            echo "Staging tip moved on ($tip); leaving it alone."
          fi
