name: staging
run-name: "staging / deploy — PR #${{ github.event.pull_request.number }}"

# Deploys a PR to `staging` for testing on the real host. Completes once the
# push lands; the agent's `staging / test` check run tracks the test, and a
# separate workflow rolls staging back if the check fails.
# SECURITY: `pull_request_target` runs this workflow from `main`, never from
# the PR. Do not change it to `pull_request` — a PR editing this file could
# then push arbitrary code to `staging`.

on:
  pull_request_target:
    types: [labeled]
    branches: [main]

# Pushes to `staging` go through the deploy key, not this token.
permissions:
  contents: read
  pull-requests: read
  checks: read       # check for an in-flight test before pushing

jobs:
  wait-for-test:
    # No concurrency group here: this only waits. The deploy job below holds
    # the shared `staging` group, so a rollback in flight runs before this
    # deployment starts.
    if: >
      github.event.label.name == 'testing requested' &&
      github.event.pull_request.state == 'open' &&
      github.event.sender.login == 'auxves'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Wait for any in-flight staging test
        # Arno: never push while the previous test is still running.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 7200 ))  # ~120 min
          while [ "$(date +%s)" -lt "$deadline" ]; do
            tip_msg=$(gh api "repos/${{ github.repository }}/branches/staging" --jq '.commit.commit.message')
            if [[ "$tip_msg" =~ \(#([0-9]+)\) ]]; then
              pr="${BASH_REMATCH[1]}"
              head=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.head.sha')
              # check_name must be pre-encoded: gh's -f leaves the literal `/`
              # unencoded, which 404s the endpoint.
              status=$(gh api "repos/${{ github.repository }}/commits/$head/check-runs?check_name=staging%20%2F%20test" \
                --jq '.check_runs | max_by(.id) | .status // "none"')
              if [ "$status" = "in_progress" ]; then
                echo "Test for PR #$pr still running; waiting."
                sleep 30
                continue
              fi
            fi
            echo "No test in flight; proceeding."
            break
          done

  deploy:
    needs: [wait-for-test]
    if: >
      github.event.label.name == 'testing requested' &&
      github.event.pull_request.state == 'open' &&
      github.event.sender.login == 'auxves'
    runs-on: ubuntu-latest
    environment: Staging
    # Shared with the rollback workflow: one staging mutation at a time, and
    # a rollback in flight runs before this deployment starts.
    # `queue: max` keeps up to 100 runs waiting (default silently cancels older queued runs).
    concurrency:
      group: staging
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.STAGING_DEPLOY_KEY }}

      - name: Squash the PR onto main and push to staging
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B staging-test origin/main
          git merge --squash "$PR_HEAD"
          git commit -m "Staging test: ${PR_TITLE} (#${PR_NUMBER})" \
                     -m "Squashed from ${PR_HEAD}. Deployed to staging for testing; do not merge this branch."
          git push --force-with-lease origin staging-test:staging
